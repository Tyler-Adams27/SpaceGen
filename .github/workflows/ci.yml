name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # lavapipe is Mesa's software Vulkan driver; the render tests run on it.
      - name: Install a software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Render tests skip themselves with "SKIPPED" when the software adapter is missing.
      # On CI that would turn the run green while testing nothing, so fail on it.
      - name: Test
        run: |
          set -o pipefail
          cargo test --workspace -- --nocapture 2>&1 | tee test-output.txt
          if grep -q SKIPPED test-output.txt; then
            echo "::error::Render tests were skipped: no software adapter on this runner."
            exit 1
          fi
